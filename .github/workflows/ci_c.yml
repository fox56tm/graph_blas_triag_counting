name: Build and lint

on:
  - push
  - pull_request

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: GrB install
        run: |
          git clone --depth 1 https://github.com/DrTimothyAldenDavis/GraphBLAS.git
          cd GraphBLAS
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DGB_TESTS=OFF
          cmake --build build --parallel $(nproc)
          sudo cmake --install build
      - name: LAGraph install
        run: |
          git clone --depth 1 https://github.com/GraphBLAS/LAGraph.git
          cd LAGraph
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel $(nproc)
          sudo cmake --install build
      - name: Check format
        run: |
          find . -path ./build -prune -o -type f -name '*.[c|h]' -print | xargs -r clang-format-18 --style=file --dry-run -Werror
      - name: Configure
        run: |
          cmake . -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Build
        run: |
          cmake --build build
      - name: Lint
        run: |
          run-clang-tidy-18 -p=build
